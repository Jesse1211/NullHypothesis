# NullHypothesis · 契约钉死表(单一真相来源)
#
# 本文件是 DESIGN.md 中【每一个被钉死的字面量】的唯一来源。
#
# 为什么存在:前八轮审查中,同一个值在文档里有多达五处独立复述
# (ADR-021 的输出样例、格式表、T6 的两条门、T13 的 I8 表),没有任何
# 机制强制它们一致 —— 于是 ADR-021 在九行之内自相矛盾(mean_abs_gap_pct
# 该显示 `0.31%` 还是 `+0.31%`)。第 6、7 两轮的修复各自引入了下一轮的
# 头号 BLOCKER,机制都一样:改了一处,没重读显示同一个值的兄弟条款。
#
# 规则:DESIGN.md 的任何条款引用字面量时,引用本文件的 key,不复述其值。
#       测试引用本文件的 key,不硬编码。
#       `tests/test_contracts.py` 校验本文件自洽(算术、格式、引用完整性)。
#
# 这不是文档的附录 —— 这是契约本体,DESIGN.md 是它的散文说明。

schema_version: 1

# ───────────────────────────────── 格式 ─────────────────────────────────
# 阶段一 CLI 渲染的数值格式。ADR-025 的五类格式化只约束阶段二的
# Presentation BC,管不到这里 —— 故阶段一必须单独钉死。
formats:
  money:            "{:,.2f}"      # 12,500.00
  count:            "{:,}"         # 2,516
  percent_signed:   "{:+.2f}%"     # +25.00% / -8.42%   有正负号意义的量
  percent_unsigned: "{:.2f}%"      # 0.31%              绝对值量,加 + 号零信息
  date:             "%Y-%m-%d"     # 2020-03-16
  null_display:     "N/A"
  # ADR-056:报告头里的【费率类】参数(fee / slippage)。四位小数 —— 5bps
  # 即 0.0005,两位小数会把它显示成 0.00(把「有成本」显示成「零成本」)。
  # 它【不是】 field_formats 的成员:fee / slippage 是 RunRequest 的字段,
  # 不是 Summary 的字段,而 field_formats 的键集合被 test_contracts.py
  # 钉死为 Summary 的字段集。
  rate:             "{:.4f}"       # 0.0005 = 5bps

# 每个 summary 字段用哪种格式 —— 这是 ADR-021 自相矛盾的根源,现在只有一处
field_formats:
  start:             date
  end:               date
  bars:              count
  initial_cash:      money
  final_equity:      money
  total_return_pct:  percent_signed     # 有方向:+25.00% / -12.00%
  trade_count:       count
  max_gap_pct:       percent_signed     # 有方向:-8.42%
  max_gap_date:      date
  mean_abs_gap_pct:  percent_unsigned   # 绝对值均值恒 >= 0,不带 +

# ──────────────────────────── 冻结的文案 ────────────────────────────
frozen_text:
  reconcile_line: "✓ 对账:每日 现金+持股市值 == 总资产"
  assumption_adjusted: "OHLC 已预先复权(框架不验证)"
  assumption_market_order: "仅支持市价单。T 日意图在 T+1 开盘无条件执行。"
  single_day_notice: "数据仅 1 日,无法产生交易"
  leverage_not_implemented: "杠杆未实现"

# ───────────────────────────── 文件名 ─────────────────────────────
filenames:
  equity_png:     "{stem}_equity.png"
  trades_csv:     "{stem}_trades.csv"
  summary_txt:    "summary.txt"
  summary_json:   "summary.json"
  run_json:       "run.json"
  comparison_png: "comparison.png"
  sample_strategies: ["buy_and_hold.py", "ma_cross.py"]
  # T8 的「三类输出齐全」= 下面这三个
  t8_required_outputs: ["{stem}_equity.png", "{stem}_trades.csv", "summary.txt"]

trades_csv_header: ["date", "side", "shares", "price", "amount", "fee", "cash_after", "shares_after"]
trade_sides: ["BUY", "SELL"]

# ───────────────────────────── 退出码 ─────────────────────────────
exit_codes:
  ok: 0
  data_validation: 2      # DataValidationError
  strategy_error: 3       # StrategyError
  invalid_cli_args: 4     # CLI 参数非法 / 文件不存在 / stem 重复

api_error_codes: ["DATA_VALIDATION", "STRATEGY_ERROR", "INVALID_REQUEST", "NOT_FOUND"]

# ───────────────────────────── 数值精度 ─────────────────────────────
rounding:
  decimals: 2
  fields: [final_equity, initial_cash, total_return_pct, max_gap_pct, mean_abs_gap_pct]

# ───────────────────────────── 正则 ─────────────────────────────
patterns:
  run_id: "^\\d{8}-\\d{6}(-\\d+)?$"
  timestamp_format: "%Y%m%d-%H%M%S"

# ═══════════════════════════ 钉死的 fixture ═══════════════════════════
# 每一项都必须能被 tests/test_contracts.py 重新算出来。
# 第 8 轮手工重算发现 ADR-038 的示例交易算错了(3693×27.07=99969.51,
# 故 cash_after 应为 30.49 而非 20.49;且 floor(100000/27.07)=3694 不是 3693)
# —— 它错在唯一没有门去读的那个块里,这正说明:注意力只到门指向的地方。

fixtures:
  # ADR-016:T+1 开盘才算股数
  adr016_fill_at_next_open:
    cash: 10000.0
    bar_t_close: 100.0
    bar_t1_open: 200.0
    weight: 1.0
    expect_shares: 50          # floor(10000/200)
    reject_shares: 100         # 错误实现:按 T 日 Close 锁定 floor(10000/100)

  # ADR-014a:可负担性约束(满仓 + 非零费率时的超买修正)
  adr014a_affordability:
    cash: 100000.0
    fee_rate: 0.0013
    open: 27.07
    weight_full: 1.0
    pinned_formula_shares: 3694      # floor(100000/27.07) —— 超买
    pinned_total_cost: 100126.58     # gross+fee,超支 126.58
    expect_shares_full: 3689         # 递减后
    weight_half: 0.5
    expect_shares_half: 1847         # 与原公式一致 —— 约束不触发
    reject_divisor_change_half: 1844 # 改除数的错误实现会给这个

  # ADR-014:分母是可投资产,三向可分
  adr014_denominator_three_way:
    cash: 10000.0
    fee_rate: 0.0
    open_1: 100.0
    open_2: 100.0
    weight_1: 0.5
    weight_2: 0.8              # 必须 != 1.0,否则 correct 与 err_spend_cash 重合
    after_leg1_shares: 50
    after_leg1_cash: 5000.0
    investable_2: 10000.0      # cash + shares*open_2
    expect_final_shares: 80    # floor(0.8*10000/100) = 80
    reject_target_from_cash: 40    # floor(0.8*5000/100)-50 = -10 -> 40
    reject_spend_cash: 90          # floor(0.8*5000/100) = +40 -> 90

  # ADR-012:floor 取整,区分 round / ceil
  adr012_floor_vs_ceil:
    cash: 10000.0
    open: 300.0
    weight: 1.0
    expect_shares: 33          # floor(33.33)
    reject_shares: 34          # ceil
    expect_cash_after: 100.0
    one_share_price: 300.0     # 断言 cash_after < 此值(未被 clamp)

  adr012_floor_vs_round:
    cash: 10000.0
    open: 1200.0
    weight: 0.1
    raw: 0.8333333333333334
    expect_shares: 0           # floor
    reject_round: 1
    reject_ceil: 1
    expect_push_count: 0       # 0 股 -> 不入队(ADR-008)

  # ADR-041:末次胜出,且末次差额为 0 时整单丢弃
  adr041_last_call_zero_delta:
    cash: 10000.0
    open: 100.0
    after_target_half_shares: 50
    after_target_half_cash: 5000.0
    investable: 10000.0
    current_weight: 0.5        # 50*100/10000 —— 故 target(0.5) 差额为 0
    sequence: ["order(100)", "target(0.5)"]
    expect_push_count: 0
    expect_fills_added: 0

  # I7:四价互异,任一错位必然失败
  #
  # ADR-056 把 I7 重写为 I7′(成交价 == Open * (1 + dir * s))。期望值按
  # 滑点更新后仍**精确可表示**,且四个候选值 50 / 100 / 400 / 200.1 **仍全部
  # 互异** —— 鉴别力完整保留,**而且增强了**:现在还能抓「用了对的 K 线但
  # 忘加滑点」这种新错误实现(忘加滑点 ⇒ 落在 reject_price_no_slippage 上)。
  # s = 0 时期望值退化为 expect_fill_price,故原门的两行一字不改仍然成立。
  i7_four_distinct_prices:
    bar0: {open: 50.0, close: 100.0}
    bar1: {open: 200.0, close: 400.0}
    order_on_bar: 0
    shares: 1
    expect_fill_price: 200.0   # bar1.Open,s = 0(原 I7,向后兼容)
    reject_prices: [50.0, 100.0, 400.0]
    # ── ADR-056(阶段三)追加:含滑点的期望值 ──
    slippage: 0.0005
    expect_fill_price_buy_slipped: 200.1    # bar1.Open * (1 + 0.0005)
    expect_fill_price_sell_slipped: 199.9   # bar1.Open * (1 - 0.0005)
    reject_price_no_slippage: 200.0         # 用了对的 K 线但忘加滑点

  # ADR-021:跳空三向可分
  adr021_gaps:
    dates: ["2020-01-02", "2020-01-03", "2020-01-06", "2020-01-07"]
    closes: [100.0, 100.0, 100.0, 100.0]
    opens:  [100.0, 105.0, 92.0, 103.0]
    gaps_pct: [5.0, -8.0, 3.0]          # round 2 后
    expect_max_gap_pct: -8.0            # 按绝对值选,按原符号显示
    expect_max_gap_date: "2020-01-06"
    expect_mean_abs_gap_pct: 5.33       # round(16/3, 2)
    reject_max_plain: 5.0               # max() 而非 max(abs())
    reject_mean_signed: 0.0             # (5-8+3)/3 恰为 0 —— 选这组数的原因
    expect_gaps_len_formula: "交易日数 - 1"

  adr021_gap_tie:
    gaps_pct: [5.0, -5.0]
    rule: "绝对值相等取较早日期"

  # Summary 字段的数值门(归 T5 —— 只有它有真实 bars)
  t5_summary_values:
    initial_cash: 10000.0
    final_equity: 12500.0
    expect_total_return_pct: 25.0
    reject_ratio_unscaled: 0.25         # 未乘 100
    reject_wrong_quotient: 125.0        # 误用 final/initial*100

  # T2:Strategy 的只读属性
  t2_strategy_equity:
    cash: 10000.0
    shares: 50
    close: 120.0
    expect_equity: 16000.0

  # T13 的 I8 不自洽 mock —— 每个字段都与可推导来源故意冲突
  i8_inconsistent_mock:
    final_equity: 999.0
    equity_last: 916062.13              # 故意不等于 final_equity
    trade_count: 7
    trades_length: 3                    # 故意不等于 trade_count
    total_return_pct: 42.0
    initial_cash: 100000.0              # 期末 200000 -> 自算会得 +100%
    implied_final: 200000.0
    max_gap_pct: -8.42
    max_gap_date: "2020-03-16"
    expect_rendered:
      final_equity: "999.00"
      trade_count: "7"
      total_return_pct: "+42.00%"
      max_gap_pct: "-8.42%"
    reject_rendered:
      total_return_pct: ["+100.00%"]
      final_equity: ["916,062.13"]
      trade_count: ["3"]
      max_gap_pct: ["8.42%", "-0.08%", "-842.00%"]

  # ADR-057:可负担性递减循环的单位成本必须含【全部】单位级成本。
  # 三值 998 / 999 / 1000 互异且可分辨:
  #   1000 = 未修正(裸 Open 作单位成本)→ cash_after = -50.0 → 抛 I1
  #    999 = 只含 s                      → cash_after = +50.05
  #    998 = 同时含 s 与 rate(G7)
  # 与 adr014a_affordability 当初钉 3689 vs 3694 的手法一致。
  adr057_slippage_affordability:
    cash: 100000.0
    open: 100.0
    weight_full: 1.0
    slippage: 0.0005
    # G6:满仓 + 只有滑点(rate = 0)
    fee_rate_zero: 0.0
    expect_shares_slippage_only: 999
    expect_cash_after_slippage_only: 50.05
    reject_shares_unfixed: 1000        # 裸 Open 作单位成本的错误实现
    reject_cash_after_unfixed: -50.0   # 它会让 Account.apply 抛 I1
    # G7:满仓 + 费率 + 滑点三者同时
    fee_rate: 0.0013
    expect_shares_fee_and_slippage: 998
    # G8:ADR-014a 原夹具 + 滑点 —— 只断言 cash_after >= 0、不抛错
    adr014a_open: 27.07
    # G1/G2:I7' 的买卖成对,四价互异 fixture 的滑点后期望值
    i7_open: 200.0
    expect_buy_price: 200.1            # 200.0 * (1 + 0.0005)
    expect_sell_price: 199.9           # 200.0 * (1 - 0.0005)
    reject_price_no_slippage: 200.0    # 忘加滑点(s=0 时这才是正确值)
    # G3/G4:手续费算在滑点后的价格上,Fill.amount 继承滑点后价
    g3_shares: 10
    g3_fee_rate: 0.001
    expect_fee_on_slipped_price: 2.001
    reject_fee_on_raw_open: 2.0        # 算在裸 Open 上
    expect_amount_slipped: 2001.0
    # G9:往返总成本 == 2s + 2*rate,精确相等
    g9_shares: 100
    g9_open: 100.0
    g9_fee_rate: 0.001
    expect_roundtrip_net_loss: 30.0    # 名义 10000 的 0.003
    # G14(b):cash ≈ 0 的持仓情形 —— 唯一能区分两种循环形式的那组
    churn_shares_held: 999
    churn_cash: 0.0
    churn_open: 27.07
    expect_churn_delta: 0              # 正确形式
    reject_churn_delta: -1             # 被废弃的 target*unit_cost>investable 形式
    # REAL_STACK_GATE(G11):data/synthetic.csv 第 2 根 K 线,buy_and_hold 首笔成交
    real_stack_open: 27.30
    expect_real_stack_fill_price: 27.313650
    reject_real_stack_shares_unfixed: 3663   # 未修正 → cash = -49.90 → 抛 I1
    # 上界与校验口径,与 --fee 逐字对称(ADR-039 的参数表)
    max_slippage_exclusive: 0.1
    default_slippage: 0.0

  # OQ-08 的阈值,双向可证伪
  oq08_search_box_threshold:
    render_when_items_gt: 20
    assert_rendered_at: 21
    assert_absent_at: 20

# ═══════════════════════ 门的可执行性前提 ═══════════════════════
# 第 8 轮发现的第四类缺陷:三条自检规则都在审查「断言」,没有任何一条
# 审查「到达断言所需的布置」。T8 的碰撞门要 monkeypatch,而同一任务的
# 其他条款规定用 subprocess 跑 —— monkeypatch 到不了子进程。
gate_execution:
  monkeypatch_seams:
    - backtest._timestamp        # T8/T11 的碰撞门
    - plot.write                 # T10 的 I9 同源断言(须按模块属性引用才可打桩)
    - api.execute_run            # T10 的串行化断言
    - Backtest.enqueue           # T4 的 push_count
    - Backtest.resolve_queue     # T4 的出队采样与 is 比对
  # 需要 monkeypatch 的门【必须在进程内】跑 —— 打桩跨不过 subprocess 边界
  in_process_required:
    - T4.queue_sampling
    - T4.push_count
    - T8.archive_collision
    - T10.serialization
    - T10.i9_same_source
    - T11.history_two_runs
  subprocess_required:
    - T8.end_to_end_cli
    - T8.exit_codes
    - T10.cli_vs_api_reconciliation
  # fixture 由谁造 —— 必须在本任务 DAG 的传递闭包内
  fixture_producers:
    T11.history_two_runs: T8     # 直接在进程内调 create_archive_dir + write_run_json
    T13.i8_mock: T10             # 契约 fixture,已 commit 进 git
    T6.pure_run_report: T6       # 手工构造,不经 Backtest
    T7.pure_run_report: T7
