# NullHypothesis · 契约钉死表(单一真相来源)
#
# 本文件是 DESIGN.md 中【每一个被钉死的字面量】的唯一来源。
#
# 为什么存在:前八轮审查中,同一个值在文档里有多达五处独立复述
# (ADR-021 的输出样例、格式表、T6 的两条门、T13 的 I8 表),没有任何
# 机制强制它们一致 —— 于是 ADR-021 在九行之内自相矛盾(mean_abs_gap_pct
# 该显示 `0.31%` 还是 `+0.31%`)。第 6、7 两轮的修复各自引入了下一轮的
# 头号 BLOCKER,机制都一样:改了一处,没重读显示同一个值的兄弟条款。
#
# 规则:DESIGN.md 的任何条款引用字面量时,引用本文件的 key,不复述其值。
#       测试引用本文件的 key,不硬编码。
#       `tests/test_contracts.py` 校验本文件自洽(算术、格式、引用完整性)。
#
# 这不是文档的附录 —— 这是契约本体,DESIGN.md 是它的散文说明。

schema_version: 1

# ───────────────────────────────── 格式 ─────────────────────────────────
# 阶段一 CLI 渲染的数值格式。ADR-025 的五类格式化只约束阶段二的
# Presentation BC,管不到这里 —— 故阶段一必须单独钉死。
formats:
  money:            "{:,.2f}"      # 12,500.00
  count:            "{:,}"         # 2,516
  percent_signed:   "{:+.2f}%"     # +25.00% / -8.42%   有正负号意义的量
  percent_unsigned: "{:.2f}%"      # 0.31%              绝对值量,加 + 号零信息
  date:             "%Y-%m-%d"     # 2020-03-16
  null_display:     "N/A"
  # ADR-056:报告头里的【费率类】参数(fee / slippage)。四位小数 —— 5bps
  # 即 0.0005,两位小数会把它显示成 0.00(把「有成本」显示成「零成本」)。
  # 它【不是】 field_formats 的成员:fee / slippage 是 RunRequest 的字段,
  # 不是 Summary 的字段,而 field_formats 的键集合被 test_contracts.py
  # 钉死为 Summary 的字段集。
  rate:             "{:.4f}"       # 0.0005 = 5bps
  # ADR-058:`sharpe` 既非金额/计数/百分比/日期,无现成格式可复用。
  # **不可**复用 `percent_signed` —— 它会给裸比率附加一个 `%`。
  ratio:            "{:.2f}"       # 1.23               裸比率,不带单位

# 每个 summary 字段用哪种格式 —— 这是 ADR-021 自相矛盾的根源,现在只有一处
field_formats:
  start:             date
  end:               date
  bars:              count
  initial_cash:      money
  final_equity:      money
  total_return_pct:  percent_signed     # 有方向:+25.00% / -12.00%
  trade_count:       count
  max_gap_pct:       percent_signed     # 有方向:-8.42%
  max_gap_date:      date
  mean_abs_gap_pct:  percent_unsigned   # 绝对值均值恒 >= 0,不带 +
  # ── ADR-058 的四个字段 ──
  sharpe:                    ratio              # 裸比率,不乘 100、不加 %
  max_drawdown_pct:          percent_unsigned   # 正数表跌幅,不带 +(同 mean_abs_gap_pct)
  max_drawdown_peak_date:    date
  max_drawdown_trough_date:  date

# ──────────────────────────── 冻结的文案 ────────────────────────────
frozen_text:
  reconcile_line: "✓ 对账:每日 现金+持股市值 == 总资产"
  assumption_adjusted: "OHLC 已预先复权(框架不验证)"
  assumption_market_order: "仅支持市价单。T 日意图在 T+1 开盘无条件执行。"
  single_day_notice: "数据仅 1 日,无法产生交易"
  leverage_not_implemented: "杠杆未实现"

# ───────────────────────────── 文件名 ─────────────────────────────
filenames:
  equity_png:     "{stem}_equity.png"
  trades_csv:     "{stem}_trades.csv"
  summary_txt:    "summary.txt"
  summary_json:   "summary.json"
  run_json:       "run.json"
  comparison_png: "comparison.png"
  sample_strategies: ["buy_and_hold.py", "ma_cross.py"]
  # T8 的「三类输出齐全」= 下面这三个
  t8_required_outputs: ["{stem}_equity.png", "{stem}_trades.csv", "summary.txt"]

trades_csv_header: ["date", "side", "shares", "price", "amount", "fee", "cash_after", "shares_after"]
trade_sides: ["BUY", "SELL"]

# ───────────────────────────── 退出码 ─────────────────────────────
exit_codes:
  ok: 0
  data_validation: 2      # DataValidationError
  strategy_error: 3       # StrategyError
  invalid_cli_args: 4     # CLI 参数非法 / 文件不存在 / stem 重复

api_error_codes: ["DATA_VALIDATION", "STRATEGY_ERROR", "INVALID_REQUEST", "NOT_FOUND"]

# ───────────────────────────── 数值精度 ─────────────────────────────
rounding:
  decimals: 2
  # ADR-058 的 sharpe 与 max_drawdown_pct 由 T23 加入该集合;
  # 两个回撤日期字段**不参与舍入**。
  fields: [final_equity, initial_cash, total_return_pct, max_gap_pct, mean_abs_gap_pct,
           sharpe, max_drawdown_pct]

# ──────────────────── 阈值(T21 / ADR-051 · 052 · 054)────────────────────
# 为什么阈值在这里而不是写成 `data.py` 的裸字面量:T21 门 12 的原话
# 「阈值不可写成裸字面量,也不可用 ADR-054 的『落在合理带内』那种散文;
# 参照 OQ-11 对跳空阈值的处置」。三个值各自有一条 ADR / OQ 钉死它。
thresholds:
  # OQ-11:跳空体检阈值,默认 20%,**构建期不得改**。
  # 张力不可消除:2:1 拆股 = −50%、4:1 = −75%,但真实暴跌也能到 −20%。
  # 故定为**提示而非错误**,宁可误报(ADR-051)。
  gap_suspicion_pct: 20.0
  # ADR-052:两路累积因子的相对偏差容差。**取 1e-4,不取 1e-6** ——
  # 厂商数据自带浮点噪声(Tiingo 把 7:1 存成 7.000007000007001,
  # 相对偏差实测 1.0e-6),1e-6 会让这条门几乎必红。
  factor_agreement_tol: 0.0001
  # ADR-054 门二:单笔现金分红 / close_before 超过此比值 → 响亮失败。
  # 抓 Yahoo / Sharadar 那类基准错导致的 5 倍膨胀(膨胀后股息率会荒谬)。
  dividend_yield_suspicion: 0.25

# ───────────────────────────── 正则 ─────────────────────────────
patterns:
  run_id: "^\\d{8}-\\d{6}(-\\d+)?$"
  timestamp_format: "%Y%m%d-%H%M%S"

# ═══════════════════════════ 钉死的 fixture ═══════════════════════════
# 每一项都必须能被 tests/test_contracts.py 重新算出来。
# 第 8 轮手工重算发现 ADR-038 的示例交易算错了(3693×27.07=99969.51,
# 故 cash_after 应为 30.49 而非 20.49;且 floor(100000/27.07)=3694 不是 3693)
# —— 它错在唯一没有门去读的那个块里,这正说明:注意力只到门指向的地方。

fixtures:
  # ADR-016:T+1 开盘才算股数
  adr016_fill_at_next_open:
    cash: 10000.0
    bar_t_close: 100.0
    bar_t1_open: 200.0
    weight: 1.0
    expect_shares: 50          # floor(10000/200)
    reject_shares: 100         # 错误实现:按 T 日 Close 锁定 floor(10000/100)

  # ADR-014a:可负担性约束(满仓 + 非零费率时的超买修正)
  adr014a_affordability:
    cash: 100000.0
    fee_rate: 0.0013
    open: 27.07
    weight_full: 1.0
    pinned_formula_shares: 3694      # floor(100000/27.07) —— 超买
    pinned_total_cost: 100126.58     # gross+fee,超支 126.58
    expect_shares_full: 3689         # 递减后
    weight_half: 0.5
    expect_shares_half: 1847         # 与原公式一致 —— 约束不触发
    reject_divisor_change_half: 1844 # 改除数的错误实现会给这个

  # ADR-014:分母是可投资产,三向可分
  adr014_denominator_three_way:
    cash: 10000.0
    fee_rate: 0.0
    open_1: 100.0
    open_2: 100.0
    weight_1: 0.5
    weight_2: 0.8              # 必须 != 1.0,否则 correct 与 err_spend_cash 重合
    after_leg1_shares: 50
    after_leg1_cash: 5000.0
    investable_2: 10000.0      # cash + shares*open_2
    expect_final_shares: 80    # floor(0.8*10000/100) = 80
    reject_target_from_cash: 40    # floor(0.8*5000/100)-50 = -10 -> 40
    reject_spend_cash: 90          # floor(0.8*5000/100) = +40 -> 90

  # ADR-012:floor 取整,区分 round / ceil
  adr012_floor_vs_ceil:
    cash: 10000.0
    open: 300.0
    weight: 1.0
    expect_shares: 33          # floor(33.33)
    reject_shares: 34          # ceil
    expect_cash_after: 100.0
    one_share_price: 300.0     # 断言 cash_after < 此值(未被 clamp)

  adr012_floor_vs_round:
    cash: 10000.0
    open: 1200.0
    weight: 0.1
    raw: 0.8333333333333334
    expect_shares: 0           # floor
    reject_round: 1
    reject_ceil: 1
    expect_push_count: 0       # 0 股 -> 不入队(ADR-008)

  # ADR-041:末次胜出,且末次差额为 0 时整单丢弃
  adr041_last_call_zero_delta:
    cash: 10000.0
    open: 100.0
    after_target_half_shares: 50
    after_target_half_cash: 5000.0
    investable: 10000.0
    current_weight: 0.5        # 50*100/10000 —— 故 target(0.5) 差额为 0
    sequence: ["order(100)", "target(0.5)"]
    expect_push_count: 0
    expect_fills_added: 0

  # I7:四价互异,任一错位必然失败
  #
  # ADR-056 把 I7 重写为 I7′(成交价 == Open * (1 + dir * s))。期望值按
  # 滑点更新后仍**精确可表示**,且四个候选值 50 / 100 / 400 / 200.1 **仍全部
  # 互异** —— 鉴别力完整保留,**而且增强了**:现在还能抓「用了对的 K 线但
  # 忘加滑点」这种新错误实现(忘加滑点 ⇒ 落在 reject_price_no_slippage 上)。
  # s = 0 时期望值退化为 expect_fill_price,故原门的两行一字不改仍然成立。
  i7_four_distinct_prices:
    bar0: {open: 50.0, close: 100.0}
    bar1: {open: 200.0, close: 400.0}
    order_on_bar: 0
    shares: 1
    expect_fill_price: 200.0   # bar1.Open,s = 0(原 I7,向后兼容)
    reject_prices: [50.0, 100.0, 400.0]
    # ── ADR-056(阶段三)追加:含滑点的期望值 ──
    slippage: 0.0005
    expect_fill_price_buy_slipped: 200.1    # bar1.Open * (1 + 0.0005)
    expect_fill_price_sell_slipped: 199.9   # bar1.Open * (1 - 0.0005)
    reject_price_no_slippage: 200.0         # 用了对的 K 线但忘加滑点

  # ADR-021:跳空三向可分
  adr021_gaps:
    dates: ["2020-01-02", "2020-01-03", "2020-01-06", "2020-01-07"]
    closes: [100.0, 100.0, 100.0, 100.0]
    opens:  [100.0, 105.0, 92.0, 103.0]
    gaps_pct: [5.0, -8.0, 3.0]          # round 2 后
    expect_max_gap_pct: -8.0            # 按绝对值选,按原符号显示
    expect_max_gap_date: "2020-01-06"
    expect_mean_abs_gap_pct: 5.33       # round(16/3, 2)
    reject_max_plain: 5.0               # max() 而非 max(abs())
    reject_mean_signed: 0.0             # (5-8+3)/3 恰为 0 —— 选这组数的原因
    expect_gaps_len_formula: "交易日数 - 1"

  adr021_gap_tie:
    gaps_pct: [5.0, -5.0]
    rule: "绝对值相等取较早日期"

  # Summary 字段的数值门(归 T5 —— 只有它有真实 bars)
  t5_summary_values:
    initial_cash: 10000.0
    final_equity: 12500.0
    expect_total_return_pct: 25.0
    reject_ratio_unscaled: 0.25         # 未乘 100
    reject_wrong_quotient: 125.0        # 误用 final/initial*100

  # T2:Strategy 的只读属性
  t2_strategy_equity:
    cash: 10000.0
    shares: 50
    close: 120.0
    expect_equity: 16000.0

  # T13 的 I8 不自洽 mock —— 每个字段都与可推导来源故意冲突
  i8_inconsistent_mock:
    final_equity: 999.0
    equity_last: 916062.13              # 故意不等于 final_equity
    trade_count: 7
    trades_length: 3                    # 故意不等于 trade_count
    total_return_pct: 42.0
    initial_cash: 100000.0              # 期末 200000 -> 自算会得 +100%
    implied_final: 200000.0
    max_gap_pct: -8.42
    max_gap_date: "2020-03-16"
    expect_rendered:
      final_equity: "999.00"
      trade_count: "7"
      total_return_pct: "+42.00%"
      max_gap_pct: "-8.42%"
    reject_rendered:
      total_return_pct: ["+100.00%"]
      final_equity: ["916,062.13"]
      trade_count: ["3"]
      max_gap_pct: ["8.42%", "-0.08%", "-842.00%"]

  # ADR-057:可负担性递减循环的单位成本必须含【全部】单位级成本。
  # 三值 998 / 999 / 1000 互异且可分辨:
  #   1000 = 未修正(裸 Open 作单位成本)→ cash_after = -50.0 → 抛 I1
  #    999 = 只含 s                      → cash_after = +50.05
  #    998 = 同时含 s 与 rate(G7)
  # 与 adr014a_affordability 当初钉 3689 vs 3694 的手法一致。
  adr057_slippage_affordability:
    cash: 100000.0
    open: 100.0
    weight_full: 1.0
    slippage: 0.0005
    # G6:满仓 + 只有滑点(rate = 0)
    fee_rate_zero: 0.0
    expect_shares_slippage_only: 999
    expect_cash_after_slippage_only: 50.05
    reject_shares_unfixed: 1000        # 裸 Open 作单位成本的错误实现
    reject_cash_after_unfixed: -50.0   # 它会让 Account.apply 抛 I1
    # G7:满仓 + 费率 + 滑点三者同时
    fee_rate: 0.0013
    expect_shares_fee_and_slippage: 998
    # G8:ADR-014a 原夹具 + 滑点 —— 只断言 cash_after >= 0、不抛错
    adr014a_open: 27.07
    # G1/G2:I7' 的买卖成对,四价互异 fixture 的滑点后期望值
    i7_open: 200.0
    expect_buy_price: 200.1            # 200.0 * (1 + 0.0005)
    expect_sell_price: 199.9           # 200.0 * (1 - 0.0005)
    reject_price_no_slippage: 200.0    # 忘加滑点(s=0 时这才是正确值)
    # G3/G4:手续费算在滑点后的价格上,Fill.amount 继承滑点后价
    g3_shares: 10
    g3_fee_rate: 0.001
    expect_fee_on_slipped_price: 2.001
    reject_fee_on_raw_open: 2.0        # 算在裸 Open 上
    expect_amount_slipped: 2001.0
    # G9:往返总成本 == 2s + 2*rate,精确相等
    g9_shares: 100
    g9_open: 100.0
    g9_fee_rate: 0.001
    expect_roundtrip_net_loss: 30.0    # 名义 10000 的 0.003
    # G14(b):cash ≈ 0 的持仓情形 —— 唯一能区分两种循环形式的那组
    churn_shares_held: 999
    churn_cash: 0.0
    churn_open: 27.07
    expect_churn_delta: 0              # 正确形式
    reject_churn_delta: -1             # 被废弃的 target*unit_cost>investable 形式
    # REAL_STACK_GATE(G11):data/synthetic.csv 第 2 根 K 线,buy_and_hold 首笔成交
    real_stack_open: 27.30
    expect_real_stack_fill_price: 27.313650
    reject_real_stack_shares_unfixed: 3663   # 未修正 → cash = -49.90 → 抛 I1
    # 上界与校验口径,与 --fee 逐字对称(ADR-039 的参数表)
    max_slippage_exclusive: 0.1
    default_slippage: 0.0
  # ADR-058:夏普 + 最大回撤。J2 裁决 —— 设计期(§15 T23)的推导数值钉在这里,
  # 测试**只引用 key、不复述字面量**。每一项都已手工重算核验。
  #
  # 夏普 = mean(r) / std(r, ddof=1) × √252,r 为简单收益且**从 equity 算**;
  # 回撤 = running-max(含当前点)下的最深跌幅,正数表跌幅,平手取较早。
  adr058_metrics:
    annualization_factor: 252         # ADR-058 硬编码,绑死日线
    risk_free_rate: 0.0               # rf=0,不加 CLI 参数;偏差已声明(ADR-059)
    degenerate_eps: 1.0e-12           # SHARPE_DEGENERATE_EPS,命名常量(负指数本就合法)

    # T1 一次 -10% 回撤后反弹
    t1_equity: [100.0, 110.0, 99.0, 118.8]
    t1_sharpe: 6.93
    t1_max_drawdown_pct: 10.0
    t1_peak_bar: 1
    t1_trough_bar: 2

    # T2 峰 120 谷 90
    t2_equity: [100.0, 120.0, 90.0, 110.0, 150.0]
    t2_sharpe: 7.99
    t2_max_drawdown_pct: 25.0         # 90/120 - 1 = -25%
    t2_peak_bar: 1
    t2_trough_bar: 2
    t2_total_return_pct: 50.0         # 100 -> 150

    # T3 从不交易(Idle),净值恒定 —— 夏普是 0/0,**未定义**故 None
    t3_sharpe: null
    t3_max_drawdown_pct: 0.0
    t3_trade_count: 0

    # T4 单调上涨 —— 回撤 0.0 但两日期 None(给日期等于断言发生过回撤)
    t4_equity: [100.0, 101.0, 102.0, 103.0]
    t4_sharpe: 1603.25
    t4_max_drawdown_pct: 0.0

    # T5 2 行 CSV —— len(r) < 2,短路不调用 std
    t5_equity: [100.0, 105.0]
    t5_sharpe: null
    t5_max_drawdown_pct: 0.0

    # T6 ⭐ ddof 判别门 —— 这一条是「刻意指定」与「随手调 np.std」的分界
    t6_equity: [100.0, 110.0, 121.0, 108.9]
    t6_sharpe: 4.58                   # ddof=1(ADR-058 钉死)
    t6_reject_sharpe_ddof0: 5.61      # 错误实现:np.std 的默认值

    # T7 ⭐ sigma != 0 但为浮点噪声(1.28e-16)—— 裸算会给 1.2e16
    t7_equity: [100.0, 110.0, 121.0, 133.1]
    t7_sharpe: null
    t7_sigma_is_exactly_zero: false   # 故 `sigma == 0` 的判定式抓不到它

    # T8 ⭐ 与 T7 同比例、起点 1e6 —— sigma 恰为 0.0,证明规则**与规模无关**
    t8_equity: [1000000.0, 1100000.0, 1210000.0, 1331000.0]
    t8_sharpe: null
    t8_sigma_is_exactly_zero: true

    # T9b ⭐ 持仓余现金(ADR-057 修正后 weight=1.0 的常态)+ 恒定比率价格。
    # cash 是固定**加项**,使 r_k 单调漂移而非恒定,于是 σ 是一个**真实的**
    # (微观)现金拖累信号 —— 高出 1e-12 守卫三个数量级故**不被抑制**。
    # 期望输出待 OQ-17 裁决(None 或封顶值);当前只能断言「拒绝裸值」。
    t9b_cash: 50.05
    t9b_shares: 999
    t9b_growth_rates: [0.001, 0.001, 0.01]
    t9b_bars: [5, 252, 252]
    # **指数必须带符号**(`2.46e+7` 而非 `2.46e7`):YAML 1.1 把后者解析成
    # **字符串**而不是浮点,于是引用它的断言会静默比较 str 与 float。
    t9b_naive_sharpe: [2.46e+7, 4.94e+5, 1.25e+5]   # 裸算输出,**均不可上报**
    t9b_reject_above: 1.0e+4                      # 任何 > 1e4 的裸值都不可接受

    # T9 round-trip:总收益 0 而夏普为正 —— 算术平均的波动拖累效应
    t9_equity: [100.0, 150.0, 100.0]
    t9_sharpe: 2.24                   # 非 None 非 0.0
    t9_max_drawdown_pct: 33.33
    t9_peak_bar: 1
    t9_trough_bar: 2
    t9_total_return_pct: 0.0

    # T11 两段回撤,后者更深 ⇒ 门住「running max 未被重置」
    t11_equity: [100.0, 90.0, 100.0, 80.0]
    t11_max_drawdown_pct: 20.0
    t11_peak_bar: 0
    t11_trough_bar: 3

    # T12 深度平手 ⇒ 门住严格 `<`(取较早的谷底 bar1,不是 bar3)
    t12_equity: [100.0, 90.0, 100.0, 90.0]
    t12_max_drawdown_pct: 10.0
    t12_peak_bar: 0
    t12_trough_bar: 1

    # 通用不变式:回撤恒 >= 0 **且符号位为正** ——
    # 只断言 >= 0.0 抓不到 -0.0(它 == 0.0 且 >= 0.0 均为真),
    # 但 summary.json 会带 '-0.0'、屏幕会显示 '-0.00%'
    reject_negative_zero_repr: "-0.0"
    forbidden_json_tokens: ["NaN", "Infinity", "-Infinity"]

  # OQ-08 的阈值,双向可证伪
  oq08_search_box_threshold:
    render_when_items_gt: 20
    assert_rendered_at: 21
    assert_absent_at: 20

  # ───────────────── T20 · 公司行为表(ADR-053 / ADR-054)─────────────────
  # 本块是 T20 全部门的期望值来源。测试只引用 key,不复述字面量
  # (本文件开头的规则,由 tests/test_design_binding.py 强制)。
  #
  # 为什么连列名与枚举都钉在这里:ADR-053 的 schema 是【对外】契约
  # (用户手写 / 厂商导出的 CSV 照它写),而 T21 的仲裁、T24 的 README
  # 都要复述同一组名字 —— 那正是本文件开头记载的「同一个值五处复述」。
  adr053_events_schema:
    columns: ["date", "event", "ratio", "amount"]     # 四列,顺序即 ADR-053 的表
    event_values: ["split", "dividend"]               # 枚举,其他值一律报错
    ignored_columns: ["symbol", "ticker"]             # 校验并忽略(前向兼容 OQ-16)
    # 枚举门必须抓到的真实野外值:前两个来自厂商导出
    # (EODHD 的 splits 端点会混入 spinoff),后两个是 ISO 的电文代码。
    rejected_event_values: ["stock_dividend", "spinoff", "SPLF", "DVCA"]

  # ADR-053 的 ratio ≡ 前向股数比(约定 A)。四种野外约定里只有 A 与
  # `f = 1/ratio` 自洽;A 与 B 互为倒数,读反即 16 倍误差且不抛异常。
  adr053_ratio_convention:
    split_4_for_1: 4.0            # 4:1 拆股 —— 约定 A
    reject_b_4_for_1: 0.25        # 约定 B(价格乘数)—— 读反的那个值
    reverse_split_1_for_8: 0.125  # 1:8 合股;ratio < 1 自然即合股
    reject_b_1_for_8: 8.0
    noop_ratio: 1.0               # 约定 D 把真实 2:1 拆股写成这个 → 必须响亮警告

  # 门 3:若按 UTC datetime 解析会整体移一天的用例。
  # 一个 UTC 午夜时刻在任何负时区(如 America/New_York)的本地日历日上
  # 就是前一天 —— 故这条断言「日历日未被移动」。
  adr053_calendar_day:
    raw_date: "2015-06-18"
    expect_iso: "2015-06-18"
    reject_utc_shifted: "2015-06-17"   # 按 UTC datetime 解析会移到这天

  # REAL_STACK_GATE 的真实行为表:一次拆股 + 两笔分红(ADR-053 的示例形状)。
  # CLI 与 API 两条路径必须解析出【同一个】事件序列。
  adr053_real_events_table:
    expect_count: 3
    expect_dates: ["2015-05-13", "2015-06-18", "2016-02-04"]
    expect_events: ["dividend", "split", "dividend"]
    expect_ratios: [null, 5.0, null]
    expect_amounts: [1.50, null, 0.52]
    filename: "events.csv"
    # ── 以下由 T21 加性追加 ──
    # T20 原先把这份行为表配到 `data/synthetic.csv` 上。T20 **不调价**,
    # 故那是一份纯格式 fixture,能通过全部格式校验;但 `synthetic.csv` 在
    # 2015-06-18 **没有任何拆股**(实测收盘 36.02 → 36.98,+2.7%),
    # 于是 T21 的**方向门**(ADR-054 门一)正确地把它判为「约定写反」。
    #
    # **这正是 T20 自己 blindSpots 预言的那件事**:「行为表写错一个 `ratio`
    # 而通过全部格式校验是可能的,**那由 T21 的方向门抓**」。
    # 故修的是 fixture(给它一份价格确实含该拆股的数据文件),
    # **不是**放宽方向门 —— 门抓到了一个真实的不一致。
    price_filename: "events_prices.csv"
    # 价格文件在拆股日**确实**跌到 1/ratio;两笔分红的 amount/close_before
    # 都远低于 `thresholds.dividend_yield_suspicion`(0.015 与 0.0052)。
    price_close_before_split: 100.0
    price_close_on_split: 20.0

  # 门 10:行为表是【标的的属性】,可能覆盖比价格切片更长的区间 →
  # 区间外的事件被忽略 + 提示(不是错误)。
  adr053_out_of_range:
    before_range: "2014-06-10"     # 早于价格序列首日
    after_range: "2016-07-20"      # 晚于价格序列末日
    expect_kept_count: 1           # 只剩区间内那一笔

  # ───────────── T21 · 因子法复权(ADR-050 / 051 / 052 / 053 / 054)─────────────
  # 本块是 T21 全部门的期望值来源。测试只引用 key,不复述字面量。
  # 每一项都由 tests/test_contracts.py 重新算出来(本文件开头的规则)。

  # ADR-053 的**实测段**:分红在前、拆股在后(最常见的次序)。
  # 这是 T21 门 6 的全部三个子门共用的 fixture —— 缺第三个子门
  # (总收益)则 H2 类缺陷(close_before 读成已调整值)不可观测。
  adr053_close_before_basis:
    # 原始(未经任何因子调整)收盘序列 —— ADR-053 实测段的四个值
    raw_closes: [100.00, 98.50, 100.00, 20.00]
    dates: ["2015-05-12", "2015-05-13", "2015-06-17", "2015-06-18"]
    dividend_date: "2015-05-13"
    dividend_amount: 1.50
    split_date: "2015-06-18"
    split_ratio: 5.0
    # close_before ≔ 除息日【前一交易日】的【原始】收盘价
    expect_close_before: 100.00
    expect_f_dividend: 0.985        # 1 − 1.50/100.00
    expect_f_split: 0.2             # 1/5.0
    # 门 6(b):05-12 复权后收盘。**拒绝** 18.500(用已拆股调整的收盘做分母)
    expect_adjusted_close_first: 19.700
    reject_adjusted_close_first: 18.500   # 1 − 1.50/20.00 = 0.925 的错误读法
    # 门 6(c):与「除息日收盘再投资」的地面真值逐位吻合 ——
    # 故本条同时验证 ADR-055 的「因子法 ≡ 自动再投资」声明为真。
    expect_total_return: 0.015228426395939021   # 20.00/19.70 − 1
    ground_truth_terminal: 101.5228426395939    # (1 + 1.50/98.50) × 5 × 20.00

  # ADR-050:后复权 + 「严格晚于 t」的累积规则。
  adr050_cumfactor:
    last_row_cumfactor: 1.0        # 后复权:最新一行恒为 1.0
    # 门 4:构造两个事件,中间区段的因子是【后一个事件】的因子,
    # 而非两者之积 —— 除权日当根 bar 不被自己的事件调整。
    split_a_ratio: 2.0
    split_b_ratio: 5.0
    expect_segment_before_a: 0.1   # (1/2)×(1/5) —— 两个事件都晚于它
    expect_segment_between: 0.2    # 仅 1/5 —— 只有 B 晚于它(不是 0.1)
    reject_segment_between: 0.1    # 把除权日当根 bar 也算进去的错误实现

  # 门 5:split 因子 = 1/ratio。合股必须**放大**历史价。
  adr050_split_factor:
    forward_4_for_1: 4.0
    expect_factor_4_for_1: 0.25
    reverse_1_for_8: 0.125
    expect_factor_1_for_8: 8.0     # 放大,不是缩小

  # 门 11:ADR-054 的方向门 —— 本特性价值最高的一条。
  # close[ex]/close[ex-1] ≈ 1/ratio;唯一能抓到约定写反(16 倍误差)的机制。
  adr054_direction_gate:
    true_ratio: 4.0                # 价格确实跌到 1/4
    reversed_ratio: 0.25           # 约定 B 写法 —— 必须报错
    # 方向门的容差:厂商有浮点噪声,**不可按精确值断言**(ADR-054 原话)
    tol: 0.05

  # 门 12:量级门的**肯定 + 否定**用例。只有肯定用例时,
  # 一个「对每笔分红都报错」的实现也能通过。
  adr054_dividend_magnitude:
    close_before: 100.0
    reject_amount: 30.0            # 比值 0.30 > 阈值 0.25 → 报错
    accept_amount: 24.0            # 比值 0.24 < 阈值 0.25 → 通过
    # 门 13:amount >= close_before → 报错(因子 <= 0 会把历史价归零或变号)
    zero_factor_amount: 100.0

  # 门 10:仲裁 tol 不可取 1e-6 —— Tiingo 把 7:1 存成这个值。
  adr052_arbitration:
    noisy_ratio: 7.000007000007001
    clean_ratio: 7.0
    # 实测相对偏差:1e-4 容得下,1e-6 会误报
    measured_rel_dev: 1.0000000000565112e-06

  # 门 15:体检阈值的**两侧**都要门住(浮点边界,不可只测一侧)。
  adr051_gap_health_check:
    # (a) 5:4 拆股 —— round 后恰为 −20.0,钉死运算符为 `>=`;写成 `>` 则必红
    boundary_ratio: 1.25
    boundary_gap_pct: -20.0
    # (b) −15% 跳空 → 断言**无**提示
    quiet_gap_pct: -15.0
    # 门 14:−75% 跳空(4:1 拆股的签名)→ 发出提示,且价格**未被调整**
    loud_gap_pct: -75.0

# ═══════════════════════ 门的可执行性前提 ═══════════════════════
# 第 8 轮发现的第四类缺陷:三条自检规则都在审查「断言」,没有任何一条
# 审查「到达断言所需的布置」。T8 的碰撞门要 monkeypatch,而同一任务的
# 其他条款规定用 subprocess 跑 —— monkeypatch 到不了子进程。
gate_execution:
  monkeypatch_seams:
    - backtest._timestamp        # T8/T11 的碰撞门
    - plot.write                 # T10 的 I9 同源断言(须按模块属性引用才可打桩)
    - api.execute_run            # T10 的串行化断言
    - Backtest.enqueue           # T4 的 push_count
    - Backtest.resolve_queue     # T4 的出队采样与 is 比对
  # 需要 monkeypatch 的门【必须在进程内】跑 —— 打桩跨不过 subprocess 边界
  in_process_required:
    - T4.queue_sampling
    - T4.push_count
    - T8.archive_collision
    - T10.serialization
    - T10.i9_same_source
    - T11.history_two_runs
  subprocess_required:
    - T8.end_to_end_cli
    - T8.exit_codes
    - T10.cli_vs_api_reconciliation
  # fixture 由谁造 —— 必须在本任务 DAG 的传递闭包内
  fixture_producers:
    T11.history_two_runs: T8     # 直接在进程内调 create_archive_dir + write_run_json
    T13.i8_mock: T10             # 契约 fixture,已 commit 进 git
    T6.pure_run_report: T6       # 手工构造,不经 Backtest
    T7.pure_run_report: T7
